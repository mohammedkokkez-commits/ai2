<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat</title>
<style>
body { margin: 0; padding: 0; background: #ece9e2; font-family: Helvetica, Arial, sans-serif; font-size: 18px; color: #222; }
#top { background: #2b2b2b; color: #fff; padding: 10px 14px; overflow: hidden; }
#top span { float: left; font-size: 20px; line-height: 30px; }
#top button { float: right; font-size: 14px; padding: 5px 10px; }
#log { padding: 10px 10px 150px 10px; }
.msg { margin: 8px 0; padding: 10px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; }
.user { background: #cfe8cf; margin-left: 15%; }
.ai { background: #fff; margin-right: 15%; border: 1px solid #d5d1c8; }
.err { background: #f6d5d5; margin-right: 15%; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; background: #d8d4ca; padding: 8px; border-top: 1px solid #b9b5ab; }
#bar table { width: 100%; border-collapse: collapse; }
#box { width: 100%; font-size: 18px; height: 48px; padding: 6px; border: 1px solid #999; border-radius: 6px; -webkit-box-sizing: border-box; box-sizing: border-box; }
#send { font-size: 18px; width: 80px; height: 48px; margin-left: 8px; }
</style>
</head>
<body>
<div id="top"><span>AI Chat</span><button id="clear" type="button">New chat</button></div>
<div id="log"></div>
<div id="bar">
  <table><tr>
    <td><textarea id="box" dir="auto" placeholder="Type here..."></textarea></td>
    <td style="width:88px"><button id="send" type="button">Send</button></td>
  </tr></table>
</div>

<script>
(function () {
  var log = document.getElementById('log');
  var box = document.getElementById('box');
  var sendBtn = document.getElementById('send');
  var clearBtn = document.getElementById('clear');
  var history = [];
  var busy = false;
  var code = '';
  try { code = window.localStorage.getItem('acode') || ''; } catch (e) {}

  function add(cls, text) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.setAttribute('dir', 'auto');
    d.appendChild(document.createTextNode(text));
    log.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
    return d;
  }

  function send() {
    var text = box.value.replace(/^\s+|\s+$/g, '');
    if (!text || busy) { return; }
    busy = true;
    sendBtn.disabled = true;
    box.value = '';
    add('user', text);
    history.push({ role: 'user', content: text });
    var wait = add('ai', '...');

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/chat', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 70000;

    function done() { busy = false; sendBtn.disabled = false; }

    function fail(msg) {
      wait.className = 'msg err';
      wait.firstChild.nodeValue = msg;
      history.pop();
      done();
    }

    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) { return; }
      var j = null;
      try { j = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 200 && j && j.reply) {
        wait.firstChild.nodeValue = j.reply;
        history.push({ role: 'assistant', content: j.reply });
        window.scrollTo(0, document.body.scrollHeight);
        done();
      } else if (xhr.status === 401) {
        var c = window.prompt('Access code:');
        if (c) {
          code = c;
          try { window.localStorage.setItem('acode', c); } catch (e) {}
        }
        fail('Wrong or missing access code. Send again.');
      } else {
        fail('Error: ' + ((j && j.error) || 'connection problem'));
      }
    };

    xhr.send(JSON.stringify({ messages: history, code: code }));
  }

  sendBtn.onclick = send;
  clearBtn.onclick = function () { history = []; log.innerHTML = ''; };
})();
</script>
</body>
</html>
